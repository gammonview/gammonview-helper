[project]
name = "gammonview-helper"
# Versioned on this repository's own tags, and deliberately *not* on the
# codec's. The helper began life inside the analysis monorepo sharing its tags;
# that coupling was wrong in both directions -- a bgsage patch renumbered a
# helper nobody had changed, and a relay change had no number of its own to
# move. What this package is a client of is the relay contract, not
# `gammonview`'s API, so the two version lines are independent and the contract
# is promised in code instead (`RELAY_CONTRACT` in `gvhelper/client.py`).
dynamic = ["version"]
description = "Analyze GammonView matches on your own computer."
readme = "README.md"
# The floor is `gammonview`'s, which is bgsage's. Nothing here needs more.
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Nicholas Vlamis" }]
keywords = ["backgammon", "gammonview", "analysis", "bgsage"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Games/Entertainment :: Board Games",
]

# This is the distribution that exists *because* the codec must stay thin. The
# engine extra comes in because analysing is the whole job; `httpx` because the
# relay is an HTTP protocol with a long poll in it; `keyring` because a worker
# token is a credential and belongs in the platform's credential store rather
# than in a file next to the config.
#
# `rumps` draws the menu-bar item on macOS, and `pystray` the notification-area
# icon on Windows -- the two platforms with an installer and a login item, so
# the ones where the helper runs with no terminal to stop it from. They are
# base dependencies rather than an extra because the installers are frozen and
# ask for plain `gammonview-helper`: an extra would never reach a machine they
# set up. `pystray` brings Pillow, to hand it the icon. On Linux, where
# `gammonview-helper install` is the installer, `dbus-fast` speaks the
# status-icon protocol directly (`linuxtray.py` says why not `pystray`), and
# Pillow is asked for by name to read the icon.
#
# Still absent: anything for watching folders. That is v2 (`docs/DesktopHelper.md`,
# "v1 analyses. It does not watch folders").
#
# The `gammonview` floor is the oldest that writes back what the site now
# writes. The site sends OGXM v2 since its 1.4.0; a 1.x codec reads it but
# drops our `x-gammonview-` records and answers in v1, and 2.0.0 counts plies
# one deeper than v2 does, so other programs read our 3ply as 4-ply; 2.0.1
# writes a set-up start twice when its first ply carries dice. (Below
# 1.5.1, too, any HedgeHog download failed with `orientation mismatch`.) An
# existing install keeps whatever it resolved first, so the floor is what
# moves it. 3.0.1 is the first that takes a preset as data and judges
# resignations, which custom presets and the resign-errors option need (3.0.0
# merged a match with a resignation wrongly). 3.1.0 records its own version in
# each analysis's `engine_build`, so a file says which side of a fix like that
# one it was made on -- what the manifest's `minimum` is for.
#
# On Windows, `bgsage` is pinned exactly and `msvc-runtime` comes with it: the
# engine's extension crashes against a C++ runtime older than the compiler it
# was built with, and many PCs have one. `_gvhelper_startup.py`, run from a `.pth`
# file at every interpreter start, loads the bundled copy first. The pin is what makes that safe -- each bgsage build
# may move to a newer compiler -- so moving it means running an analysis on a
# Windows machine with an old runtime first.
dependencies = [
    "gammonview[engine]>=3.1.0",
    "httpx>=0.27",
    "keyring>=25.0",
    "rumps>=0.4; sys_platform == 'darwin'",
    "pystray>=0.19; sys_platform == 'win32'",
    "dbus-fast>=2.0; sys_platform == 'linux'",
    "pillow>=10; sys_platform == 'linux'",
    "bgsage==2.0.20260907; sys_platform == 'win32'",
    "msvc-runtime>=14.44; sys_platform == 'win32'",
]

[project.urls]
Homepage = "https://gammonview.com"
Repository = "https://github.com/ngvlamis/gammonview-helper"
Issues = "https://github.com/ngvlamis/gammonview-helper/issues"

[project.scripts]
gammonview-helper = "gvhelper.cli:main"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
# Derived from git tags: pushing v0.2.0 publishes 0.2.0, so the tag *is* the
# version and there is no second place for it to disagree. `publish.yml`
# refuses to upload anything carrying a `dev` or `+local` segment, which is
# what hatch-vcs stamps when it cannot find a tag -- the failure mode worth
# guarding, because it is silent rather than loud.
source = "vcs"

[tool.hatch.version.raw-options]
# Only this package's own tags. Without the match, `git describe` takes the
# newest tag of either namespace -- and `v0.3.0` and `launcher-v1.0.3` sit on
# the same commit, so building that release again would have stamped the
# package 1.0.3, the installer's number. It published correctly only because
# the launcher tag came later.
git_describe_command = ["git", "describe", "--dirty", "--tags", "--long", "--match", "v*"]

[tool.hatch.build.targets.wheel]
packages = ["gvhelper"]

# Beside the package, not in it: see `_gvhelper_startup.py`.
[tool.hatch.build.targets.wheel.force-include]
"_gvhelper_startup.py" = "_gvhelper_startup.py"
"_gvhelper_startup.pth" = "_gvhelper_startup.pth"

[tool.hatch.build.targets.sdist]
# The sdist is the source of the *Python package*; the git tag is the source
# snapshot of the project. `launcher/` is a macOS GUI app with a 300 KB icon in
# it and nothing `pip install` will ever build, so it stays out of a file every
# installation without a matching wheel has to download.
exclude = ["launcher"]

[dependency-groups]
dev = [
    "pytest>=8",
    "respx>=0.21",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# For `_gvhelper_startup`, which sits beside the package rather than in it.
pythonpath = ["."]
markers = [
    # The one test that runs a real analysis. Registered so the rest of the
    # suite can be run without the engine (`-m "not slow"`), which is what a
    # contributor touching the CLI wants and what keeps CI's codec-only job
    # meaningful.
    "slow: runs the bgsage engine on a real match",
    # Needs a reachable GammonView site. Never runs in CI: the server half of
    # the relay is in a private repository, so there is nothing for a public
    # workflow to stand up, and pointing CI at the live beta would make every
    # push a request to a running service. Run it by hand after a relay change
    # -- that is the moment it exists for. See `docs/Relay.md`.
    "contract: talks to a live relay (opt-in, needs GAMMONVIEW_CONTRACT_BASE)",
]
